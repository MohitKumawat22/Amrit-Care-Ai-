<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#tealGrad)"/>

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Medical Cross Glow -->
  <g filter="url(#glow)">
    <!-- Cardiogram pulse line through the heart -->
    <path d="M96 256h80l28-72 44 144 36-104 24 48 20-16h88" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center Heartbeat Accent Dot -->
  <circle cx="248" cy="328" r="14" fill="#2dd4bf"/>
  <circle cx="204" cy="184" r="12" fill="#2dd4bf"/>
</svg>
